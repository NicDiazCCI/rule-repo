version: 2.1

orbs:
  node: circleci/node@7

executors:
  node-executor:
    docker:
      - image: cimg/node:22.19
    resource_class: medium

jobs:
  install-dependencies:
    executor: node-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - node-deps-v1-{{ checksum "package-lock.json" }}
            - node-deps-v1-
      - node/install-packages:
          pkg-manager: npm
          cache-path: ~/.npm
      - save_cache:
          key: node-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
            - node_modules
      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  test:
    executor: node-executor
    parallelism: 1
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Create test results directory
          command: mkdir -p test-results
      - run:
          name: Run Jest tests
          command: npm run test -- --ci --coverage --maxWorkers=2 --reporters=default --reporters=jest-junit
          environment:
            JEST_JUNIT_OUTPUT_DIR: test-results
            JEST_JUNIT_OUTPUT_NAME: junit.xml
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results
      - store_artifacts:
          path: coverage
          destination: coverage

  build:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Clean previous build
          command: npm run clean
      - run:
          name: Build TypeScript project
          command: npm run build
      - run:
          name: Create artifacts directory
          command: mkdir -p ~/artifacts
      - run:
          name: Copy build artifacts
          command: cp -R dist ~/artifacts/ 2>/dev/null || true
      - store_artifacts:
          path: ~/artifacts
          destination: build-artifacts
      - persist_to_workspace:
          root: .
          paths:
            - dist

  # Uncomment and configure the deploy job when ready to deploy
  # deploy:
  #   executor: node-executor
  #   steps:
  #     - checkout
  #     - attach_workspace:
  #         at: .
  #     - run:
  #         name: Deploy application
  #         command: |
  #           # Add your deployment commands here
  #           # Examples:
  #           # - Deploy to AWS: aws s3 sync dist/ s3://your-bucket/
  #           # - Deploy to Vercel: vercel --prod
  #           # - Deploy to Heroku: git push heroku main
  #           # - Deploy to custom server: scp -r dist/ user@server:/path/
  #           echo "Configure deployment here"

workflows:
  version: 2
  ci-pipeline:
    jobs:
      - install-dependencies
      - test:
          requires:
            - install-dependencies
      - build:
          requires:
            - install-dependencies
      # Uncomment to enable deployment after tests and build pass
      # - deploy:
      #     requires:
      #       - test
      #       - build
      #     filters:
      #       branches:
      #         only:
      #           - main
